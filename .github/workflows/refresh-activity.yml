name: Refresh GitHub activity

# Keeps the contribution graph's snapshot current. The site serves the committed
# JSON rather than calling the API from visitors' browsers; see
# frontend/scripts/fetch-github-activity.mjs for why.
#
# Delete this file to stop the weekly commit. The graph keeps working, and its
# label names the date the data runs to, so it just shows its age.
on:
  schedule:
    - cron: "17 4 * * 1" # Mondays, off the hour when scheduled runs bunch up
  workflow_dispatch:

# The one workflow in this repository that writes, so it asks for that itself
# rather than widening the default.
permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  refresh:
    name: Refresh snapshot
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Use Node.js from .nvmrc
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: ".nvmrc"

      # A failed run changes nothing: the script only writes a validated response,
      # so the site keeps the last good snapshot until next week.
      - name: Fetch contributions
        run: node frontend/scripts/fetch-github-activity.mjs

      - name: Commit if changed
        run: |
          if git diff --quiet -- frontend/src/data/github-activity.json; then
            echo "No change."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/src/data/github-activity.json
          git commit -m "chore: refresh GitHub activity snapshot"
          git push
