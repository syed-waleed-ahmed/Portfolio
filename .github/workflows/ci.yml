name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Least privilege by default; jobs opt in to more if they ever need it.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Every action is pinned to a full commit SHA, with its version in a comment.
# A tag can be moved to other code after review; a SHA cannot. Dependabot's
# github-actions updater bumps the SHA and the comment together.
jobs:
  frontend:
    name: Site and Worker (lint, types, tests, invariants, build, size, audit)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # node-version-file, not a hardcoded number: .nvmrc is the single source
      # of truth for local work, CI and the deploy, so they can't drift apart.
      # The invariants test fails on a workflow that hardcodes a version.
      - name: Use Node.js from .nvmrc
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: ".nvmrc"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      # The content and routing tests and the Worker's contact API tests.
      - name: Unit tests
        run: npm test

      # Rules a build would not catch: contrast in both themes, the CSP,
      # the Worker configuration, the Node pin and the rest.
      - name: Repository invariants
        run: node --test ../test/invariants.test.ts

      # Compiles the client and server bundles and prerenders the page, so a
      # component that throws during render fails here rather than in a deploy.
      # --ignore-scripts skips the prebuild gate, which repeats the three steps
      # above; it exists for the deploys that do not pass through this job.
      - name: Build
        run: npm run build --ignore-scripts

      - name: Bundle size budgets
        run: npm run size

      - name: Audit (production deps only, fail on high+)
        run: npm audit --omit=dev --audit-level=high

  e2e:
    name: Browser tests (Playwright + axe)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Use Node.js from .nvmrc
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: ".nvmrc"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      # The browser matching the installed @playwright/test, plus the system
      # libraries it needs on the runner.
      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Build
        run: npm run build --ignore-scripts

      # Served by e2e/serve.mjs with the headers from public/_headers, so the
      # suite runs under the production CSP. Firefox and WebKit are run by hand.
      - name: Browser tests
        run: npm run test:e2e -- --project=chromium

      - name: Upload the Playwright report
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 14

  secret-scan:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # gitleaks scans full history, not just the tip
          persist-credentials: false

      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # The site and its Worker ship only from here, and only once every job above
  # is green on a push to main: a pull request is checked but never published.
  # A newer push cancels this run (see `concurrency` at the top), which is safe
  # at any point, since Cloudflare switches versions only when an upload has
  # finished.
  deploy:
    name: Deploy
    needs: [frontend, e2e, secret-scan]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    uses: ./.github/workflows/deploy.yml
    secrets:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
