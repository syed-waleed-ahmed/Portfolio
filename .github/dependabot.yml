version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
    open-pull-requests-limit: 5
    # A just-published release is the riskiest one to pull in: a compromised or
    # broken version is usually caught and pulled within days. Security updates
    # are not delayed by this.
    cooldown:
      default-days: 7
    # Minor and patch updates arrive as one grouped PR. A major is left out of
    # the group, so each arrives as its own PR, to be read against its
    # changelog; ignoring majors meant never hearing of them.
    groups:
      minor-and-patch:
        update-types: ["minor", "patch"]
    ignore:
      # Tracks the Node major in .nvmrc: newer types would accept APIs the
      # pinned Node lacks. Move it when .nvmrc moves.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      # typescript-eslint supports TypeScript below 6.1, so 7 fails the lint.
      # Remove this once its peer range admits 7.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
    commit-message:
      prefix: "chore(deps)"
      prefix-development: "chore(deps-dev)"
    labels: ["dependencies", "frontend"]


  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
    open-pull-requests-limit: 5
    # A just-published release is the riskiest one to pull in: a compromised or
    # broken version is usually caught and pulled within days. Security updates
    # are not delayed by this.
    cooldown:
      default-days: 7
    # Majors are grouped with everything else here, unlike npm above. An
    # Action's major is how it ships a new runner (node20 -> node24) or drops a
    # deprecated input, the update you most need; skipping them is what left
    # checkout/setup-node three majors behind and gitleaks two. One group keeps
    # it to one PR to review.
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: "chore(ci)"
    labels: ["dependencies", "ci"]
