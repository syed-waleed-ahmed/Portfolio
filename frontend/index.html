<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#f7f6f2" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#111214" />
    <link rel="icon" type="image/png" sizes="96x96" href="/favicon-96x96.png" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="shortcut icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <!-- Every weight on every page comes from this one file. crossorigin is
         required even on the same origin: font fetches are CORS-mode. -->
    <link rel="preload" as="font" type="font/woff2" href="/fonts/hanken-grotesk-latin-wght.woff2" crossorigin />
    <!--app-head-->
  </head>
  <body>
    <!-- scripts/prerender.mjs writes each page's markup here; main.tsx hydrates it. -->
    <div id="root"><!--app-html--></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
