<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#0b1221" />
    <meta name="robots" content="noindex" />
    <title>Page not found · Syed Waleed Ahmed</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <style>
      /* Standalone page with no bundled CSS, so the palette and type are
         inlined by hand. Keep them in step with src/styles/tokens.css and the
         @font-face in src/styles/base.css - see docs/design.md. */
      @font-face {
        font-family: "Hanken Grotesk";
        font-style: normal;
        font-weight: 100 900;
        font-display: swap;
        src: url("/fonts/hanken-grotesk-latin-wght.woff2") format("woff2");
      }
      @font-face {
        font-family: "Hanken Grotesk Fallback";
        src: local("Arial"), local("Helvetica Neue"), local("Helvetica"), local("Roboto");
        size-adjust: 100%;
        ascent-override: 100%;
        descent-override: 30.3%;
        line-gap-override: 0%;
      }
      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        min-height: 100%;
        background: #0b1221;
        color: #dce3ec;
        font-family: "Hanken Grotesk", "Hanken Grotesk Fallback", system-ui, sans-serif;
        -webkit-font-smoothing: antialiased;
      }
      main {
        min-height: 100vh;
        min-height: 100dvh;
        display: grid;
        place-items: center;
        padding: 2rem 1rem;
      }
      .card {
        max-width: 30rem;
      }
      .code {
        margin: 0 0 1rem;
        font-family: ui-monospace, "SF Mono", "Cascadia Mono", Menlo, Consolas, monospace;
        font-size: 0.8125rem;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: #22d3ee;
      }
      h1 {
        margin: 0 0 0.75rem;
        font-size: clamp(2rem, 6vw, 2.75rem);
        font-weight: 700;
        line-height: 1.1;
        letter-spacing: -0.025em;
        color: #f5f7fb;
      }
      p {
        margin: 0 0 2rem;
        line-height: 1.6;
        color: #b7c2d0;
      }
      /* Matches .btn.btn--primary on the main site. */
      a {
        display: inline-flex;
        align-items: center;
        min-height: 44px;
        padding: 0.5rem 1.25rem;
        border-radius: 10px;
        background: #22d3ee;
        color: #04161c;
        font-weight: 600;
        text-decoration: none;
        transition: background-color 150ms ease;
      }
      a:hover {
        background: #67e8f9;
      }
      a:focus-visible {
        outline: 2px solid #22d3ee;
        outline-offset: 3px;
      }
    </style>
  </head>
  <body>
    <main>
      <div class="card">
        <p class="code">Error 404</p>
        <h1>Page not found</h1>
        <p>
          That page doesn't exist on this site, or it has since moved. The
          homepage has everything: projects, experience and contact details.
        </p>
        <a href="/">Back to the homepage</a>
      </div>
    </main>
  </body>
</html>
